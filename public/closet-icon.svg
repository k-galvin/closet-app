<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#ffffff"/>
  <rect x="24" y="24" width="464" height="464" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Archival Cobalt Blue Dot Accent -->
  <circle cx="256" cy="140" r="16" fill="#0047ab"/>
  
  <!-- Architectural Hanger & Wardrobe geometry -->
  <!-- Hook -->
  <path d="M256,180 C236,180 236,220 256,230" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
  <!-- Shoulder bar -->
  <path d="M120,310 L256,230 L392,310" fill="none" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="140" y1="310" x2="372" y2="310" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>

  <!-- Archival Typography Monogram -->
  <text x="256" y="380" font-family="monospace" font-size="24" font-weight="700" letter-spacing="8" fill="#0047ab" text-anchor="middle">ARCHIVAL</text>
  <text x="256" y="415" font-family="monospace" font-size="12" font-weight="400" letter-spacing="6" fill="#888888" text-anchor="middle">WARDROBE</text>
</svg>
